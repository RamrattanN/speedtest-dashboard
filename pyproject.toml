[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speedtest-dashboard-nr"
version = "0.2.0"
description = "Self-hosted internet speed monitoring with Streamlit dashboard and CSV storage."
readme = "README.md"
authors = [{ name = "Nilesh Ramrattan" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.7.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.22",
    "streamlit>=1.37",
    "speedtest-cli>=2.1.3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = [
    "build>=1.2",
    "pytest>=8",
]
macos-pilot = [
    "pyinstaller>=6.22",
]
windows-pilot = [
    "pyinstaller>=6.22",
]

[project.urls]
Homepage = "https://github.com/RamrattanN/speedtest-dashboard"
Issues = "https://github.com/RamrattanN/speedtest-dashboard/issues"

[project.scripts]
speedtest-dashboard = "speedtest_dashboard.runner:main"
speedtest-collector = "speedtest_dashboard.collector_app:main"
speedtest-dashboard-ui = "speedtest_dashboard.dashboard_app:main"
speedtest-dashboard-macos = "speedtest_dashboard.macos_app:main"
speedtest-dashboard-windows = "speedtest_dashboard.windows_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speedtest_dashboard = ["assets/*.b64"]
